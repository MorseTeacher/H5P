<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liveability Mayor: Visible Prototype</title>
<style>
:root{--line:#d5dde8;--ink:#102033;--muted:#617084;--blue:#1d4ed8;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top left,#365f86 0,#102033 46%,#07111f 100%);color:var(--ink)}
.shell{max-width:1360px;margin:0 auto;padding:18px}header{color:#fff;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-bottom:14px}
.layout{display:grid;grid-template-columns:1.1fr .95fr;grid-template-areas:'map right' 'sell sell';gap:16px}.mapPanel{grid-area:map}.rightGrid{grid-area:right;display:grid;gap:12px}.sellPanel{grid-area:sell}
.panel{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px}.panelTitle{display:flex;justify-content:space-between}.small{font-size:13px;color:var(--muted)}
.topStats{display:flex;gap:10px}.topStat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 14px;text-align:center}.topStat b{display:block;font-size:24px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.tile{min-height:84px;border-radius:14px;border:2px solid rgba(15,23,42,.15);padding:8px;display:flex;flex-direction:column;justify-content:space-between}.tile.issue{border-color:#f59e0b}
.tile.housing{background:#fee2e2}.tile.center{background:#e0e7ff}.tile.road{background:#e5e7eb}.tile.green{background:#bbf7d0}.tile.water{background:#bfdbfe}.tile.service{background:#cffafe}
.complaints,.actions,.adGrid{display:grid;gap:8px}.complaint{background:#fff7ed;border:1px solid #fed7aa;border-left:6px solid #f97316;border-radius:12px;padding:10px}
.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.cardBtn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;text-align:left}.cardBtn.disabled{opacity:.45}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.barCard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}.meter{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.fill{height:100%}
.taxRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pillBtn{border:2px solid var(--line);border-radius:999px;padding:9px;background:#fff}.pillBtn.active{border-color:var(--blue);background:#dbeafe}
.adGrid{grid-template-columns:repeat(4,minmax(0,1fr))}.adCard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px}.miniBtn{padding:4px 8px}
@media(max-width:980px){.layout{grid-template-columns:1fr;grid-template-areas:'map' 'right' 'sell'}.adGrid,.actions,.bars{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell"><header><div><h1>Liveability Mayor</h1></div><div class="topStats"><div class="topStat"><span>Round</span><b id="roundStat">1/4</b></div><div class="topStat"><span>Population</span><b id="popStat">8,000</b></div><div class="topStat"><span>Budget</span><b id="budgetStat">$5m</b></div></div></header>
<main class="layout">
<section class="panel mapPanel"><div class="panelTitle"><h2>Riverbend Map</h2><div class="small"><b id="actionsLeft">2</b> actions left</div></div><div id="map" class="map"></div><div id="scoreBars" class="bars"></div></section>
<section class="rightGrid"><div class="panel"><div class="panelTitle"><h2>Resident Pressure</h2></div><div id="complaints" class="complaints"></div></div><div class="panel"><div class="panelTitle"><h2>Build or Improve</h2><span class="small">Affordable options only</span></div><div id="actions" class="actions"></div></div><div class="panel"><h2>Round Result</h2><div id="result">Pick two actions.</div></div></section>
<section class="panel sellPanel"><div class="panelTitle"><h2>Sell the Town</h2><span class="small">Tax affects affordability and next-round funds, not ad quality.</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Target</label><select id="targetSelect"></select></div><div><label>Tax</label><div class="taxRow"><button class="pillBtn" data-tax="low">Low</button><button class="pillBtn active" data-tax="medium">Medium</button><button class="pillBtn" data-tax="high">High</button></div></div></div><div id="ads" class="adGrid"></div><div id="forecast" class="small"></div><button id="launchBtn">Launch Campaign</button><button id="resetBtn">Reset</button></section>
</main></div>
<script>
const tilesBase=[{id:'station',label:'Bus Stop',type:'road',symbol:'BUS'},{id:'clinic',label:'Clinic',type:'service',symbol:'CARE'},{id:'market',label:'Market',type:'center',symbol:'MKT'},{id:'crossing',label:'Crossing',type:'road',symbol:'X'},{id:'wetlands',label:'Wetlands',type:'water',symbol:'WILD'},{id:'rentals',label:'Rentals',type:'housing',symbol:'RENT'},{id:'library',label:'Hall',type:'center',symbol:'HALL'},{id:'park',label:'Park',type:'green',symbol:'PARK'},{id:'oldShops',label:'Shops',type:'center',symbol:'SHOP'},{id:'empty1',label:'Lot',type:'green',symbol:'LOT'}];
while(tilesBase.length<25) tilesBase.push({id:'g'+tilesBase.length,label:'Block',type:'green',symbol:'•'});
const scoreDefs={access:'Access',safety:'Safety',environment:'Environment',community:'Community',affordability:'Affordability',jobs:'Jobs',health:'Health',youth:'Youth',trust:'Trust'};
const groups={'Young families':{wants:['safety','affordability','community','access'],channels:['Facebook','Streaming','Real estate']},'Teenagers':{wants:['youth','access','community'],channels:['Instagram','Gaming','Streaming']},'Retirees':{wants:['health','safety','access'],channels:['Facebook','Radio','Newspaper']},'Young workers':{wants:['jobs','affordability','access','community'],channels:['Instagram','Streaming','Gaming']}};
const actionCards=[{name:'Run Better Bus Loop',cost:1,effects:{access:16,youth:8},fixes:['access','youth']},{name:'Open Medical Centre',cost:2,effects:{health:20,safety:4},fixes:['health']},{name:'Affordable Housing',cost:2,effects:{affordability:18,environment:-4},fixes:['affordability']},{name:'Fix Crossings',cost:1,effects:{safety:14,access:10},fixes:['safety','access']},{name:'Revive Main Street',cost:1.5,effects:{jobs:16,community:8},fixes:['jobs','community']},{name:'Upgrade Park',cost:1,effects:{environment:12,community:8},fixes:['environment','community']},{name:'Youth Space',cost:.5,effects:{youth:18,community:6},fixes:['youth']}];
const adChannels={Instagram:{},Facebook:{},Radio:{},Newspaper:{},Streaming:{},Gaming:{},'Real estate':{},Tourism:{}};
let state;const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));const money=v=>'$'+(Math.round(v*10)/10)+'m';
function freshState(){return{round:1,maxRounds:4,population:8000,budget:5,actionsLeft:2,tax:'medium',scores:{access:45,safety:60,environment:70,community:55,affordability:65,jobs:40,health:45,youth:35,trust:60},tiles:structuredClone(tilesBase),built:[],adSpend:Object.fromEntries(Object.keys(adChannels).map(k=>[k,0])),target:'Young families'}}
function avg(keys){return keys.reduce((a,k)=>a+state.scores[k],0)/keys.length}function groupMood(n){return clamp(avg(groups[n].wants))}
function getComplaints(){const s=state.scores,l=[];if(s.youth<55)l.push({cat:'youth',text:'Nothing for teenagers.'});if(s.access<55)l.push({cat:'access',text:'Buses unreliable.'});if(s.jobs<55)l.push({cat:'jobs',text:'Need jobs.'});if(s.health<55)l.push({cat:'health',text:'Not enough doctors.'});if(s.affordability<58)l.push({cat:'affordability',text:'Rent too expensive.'});if(s.safety<58)l.push({cat:'safety',text:'Unsafe at night.'});return l.sort((a,b)=>s[a.cat]-s[b.cat]).slice(0,3)}
function render(){roundStat.textContent=`${Math.min(state.round,state.maxRounds)}/${state.maxRounds}`;popStat.textContent=state.population.toLocaleString();budgetStat.textContent=money(state.budget);actionsLeft.textContent=state.actionsLeft;renderMap();renderBars();complaints.innerHTML=getComplaints().map(c=>`<div class='complaint'><b>${c.cat}</b> ${c.text}</div>`).join('');renderActions();renderTarget();renderTax();renderAds();renderForecast()}
function renderMap(){map.innerHTML=state.tiles.map(t=>`<div class='tile ${t.type}'><div>${t.symbol}</div><div>${t.label}</div></div>`).join('')}
function renderBars(){scoreBars.innerHTML=Object.entries(scoreDefs).map(([k,l])=>`<div class='barCard'><div>${l} ${state.scores[k]}</div><div class='meter'><div class='fill' style='width:${state.scores[k]}%;background:${state.scores[k]>=70?'#15803d':state.scores[k]>=50?'#b45309':'#b91c1c'}'></div></div></div>`).join('')}
function renderActions(){actions.innerHTML=actionCards.map(c=>{const affordable=state.budget>=c.cost;const usable=state.actionsLeft>0&&affordable&&!state.built.includes(c.name);return `<button class='cardBtn ${affordable?'':'disabled'}' ${usable?'':'disabled'} onclick="applyAction('${c.name}')"><div><b>${c.name}</b></div><div>${money(c.cost)}</div></button>`}).join('')}
function renderTarget(){targetSelect.innerHTML=Object.keys(groups).map(g=>`<option ${g===state.target?'selected':''}>${g}</option>`).join('');targetSelect.onchange=()=>{state.target=targetSelect.value;renderForecast()}}
function renderTax(){document.querySelectorAll('[data-tax]').forEach(b=>{b.classList.toggle('active',b.dataset.tax===state.tax);b.onclick=()=>{state.tax=b.dataset.tax;renderTax();renderForecast()}})}
function renderAds(){ads.innerHTML=Object.keys(adChannels).map(name=>`<div class='adCard'><div>${name}: ${state.adSpend[name]}</div><button class='miniBtn' onclick="changeAd('${name}',-1)">-</button><button class='miniBtn' onclick="changeAd('${name}',1)">+</button></div>`).join('')}
function selectedAdTotal(){return Object.values(state.adSpend).reduce((a,b)=>a+b,0)}
function renderForecast(){const target=state.target;let reach=0;for(const [ch,a] of Object.entries(state.adSpend)){if(a>0)reach+=a*(groups[target].channels.includes(ch)?18:6)}forecast.innerHTML=`Target fit ${groupMood(target)} | Ad reach ${reach} | Tax ${state.tax} affects affordability+next budget only.`}
function applyAction(name){const c=actionCards.find(x=>x.name===name);if(!c||state.actionsLeft<=0||state.budget<c.cost)return;state.budget=+(state.budget-c.cost).toFixed(2);state.actionsLeft--;state.built.push(c.name);Object.entries(c.effects).forEach(([k,v])=>state.scores[k]=clamp(state.scores[k]+v));render();result.textContent=`${c.name} built.`}
function changeAd(name,d){const t=selectedAdTotal();if(d>0&&t>=3)return;state.adSpend[name]=Math.max(0,state.adSpend[name]+d);renderAds();renderForecast()}
function launchCampaign(){if(state.actionsLeft>0)return alert('Use two actions first.');if(!selectedAdTotal())return alert('Add ad spend.');if(state.tax==='low'){state.scores.affordability=clamp(state.scores.affordability+5);state.budget+=2}else if(state.tax==='medium'){state.budget+=3}else{state.scores.affordability=clamp(state.scores.affordability-6);state.budget+=4}
let reach=0;for(const [ch,a] of Object.entries(state.adSpend)){if(a>0)reach+=a*(groups[state.target].channels.includes(ch)?18:6)}const fit=groupMood(state.target),trust=state.scores.trust;const growth=Math.round((fit-45)*7+reach*7+(trust-50)*4);const delta=Math.max(-150,Math.min(950,growth));state.population=Math.max(7200,state.population+delta);state.scores.trust=clamp(state.scores.trust-Math.max(0,Math.round((reach-fit)/10)));result.innerHTML=`Population ${delta>=0?'+':''}${delta}.`;state.round++;if(state.round>state.maxRounds){alert('Game complete');restartGame();return}state.actionsLeft=2;state.built=[];state.adSpend=Object.fromEntries(Object.keys(adChannels).map(k=>[k,0]));render()}
function restartGame(){state=freshState();render();result.textContent='Pick two actions.'}
launchBtn.onclick=launchCampaign;resetBtn.onclick=restartGame;window.applyAction=applyAction;window.changeAd=changeAd;restartGame();
</script></body></html>
