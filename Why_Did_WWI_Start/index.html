5;paint-order:stroke;stroke:#142832;stroke-width:4px;stroke-linejoin:round}.pin{fill:#263e4a;stroke:#b9cbd3;stroke-width:2}.pin.selected{fill:#f5c76c;stroke:#fff2cc}.link{fill:none;stroke-width:3}.entente{stroke:#85d8cf}.alliance{stroke:#f5c76c}.support{stroke:#c2cbd0;stroke-dasharray:5 6}.line-key{font-size:.85rem;margin:12px 0}.line-key span{margin-right:12px}.source-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.source-tabs button[aria-pressed=true]{border:2px solid var(--gold)}.stamp{border:2px solid #856129;display:inline-block;padding:4px 10px;transform:rotate(-2deg);font-size:.85rem;text-transform:uppercase;font-weight:800;color:#674916;margin-bottom:18px}.timeline{list-style:none;padding:0;margin:0}.timeline li{padding:12px 0 12px 18px;border-left:3px solid var(--teal);position:relative}.timeline li:before{content:'';position:absolute;width:11px;height:11px;background:var(--teal);border-radius:50%;left:-7px;top:22px}.timeline strong{display:block;color:var(--teal)}.timeline .empty{border-color:var(--line);color:var(--muted)}.timeline .empty:before{background:var(--line)}.event button{width:100%}.event-date{color:var(--gold);display:block;font-size:.85rem;font-weight:800}.evidence{margin-top:14px;border-top:1px solid #b7ac97;padding-top:14px;font-size:.85rem}.score{font:700 4rem Georgia,serif;color:var(--gold)}.recap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.recap>div{padding:16px;background:#1a2b35;border-top:3px solid var(--gold);border-radius:8px}.recap b{display:block;margin-bottom:8px}label{display:block;margin:18px 0 8px;font-weight:700}textarea{width:100%;min-height:140px;background:#101b23;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:14px;resize:vertical}details{margin:20px 0}summary{cursor:pointer;min-height:44px;padding:8px 0;color:var(--gold)}footer{margin-top:30px;border-top:1px solid var(--line);padding-top:18px;font-size:.85rem;color:var(--muted)}dialog{max-width:760px;width <script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const causes=[
 {name:'Militarism',icon:'⚓',text:'Countries built bigger armies and navies. Rivals feared being left behind.',answer:0,why:'This arms race grew over years. It increased fear before the assassination.'},
 {name:'The Sarajevo assassination',icon:'◉',text:'On 28 June 1914, Franz Ferdinand and his wife Sophie were shot and killed.',answer:1,why:'This event sparked the July Crisis. War followed a month of government decisions.'},
 {name:'Imperialism',icon:'◈',text:'European powers competed for colonies, resources and influence overseas.',answer:0,why:'Competition between empires created rivalry over many years.'},
 {name:'Alliances',icon:'⛓',text:'Countries made agreements to support one another. Rivals felt threatened.',answer:0,why:'These relationships existed before June 1914. They could widen a crisis, but did not make every country join automatically.'},
 {name:'Nationalism',icon:'⚑',text:'Strong loyalty to a nation fuelled rivalry. Some groups wanted freedom from empires.',answer:0,why:'Nationalist tensions grew over years. In the Balkans, they challenged Austria-Hungary’s rule.'}
];
const countries=[
 {id:'britain',name:'Britain',tag:'Triple Entente',text:'Britain had agreements with France and Russia. These were not an automatic promise to fight. British leaders chose to enter the war on 4 August.',x:137,y:137},
 {id:'france',name:'France',tag:'Triple Entente',text:'France had a formal military alliance with Russia. French leaders feared Germany’s power.',x:175,y:248},
 {id:'russia',name:'Russia',tag:'Triple Entente',text:'Russia was allied with France and supported Serbia. It ordered general mobilisation on 30 July, alarming Germany.',x:455,y:125},
 {id:'germany',name:'Germany',tag:'Triple Alliance',text:'Germany was allied with Austria-Hungary and Italy. In July it promised strong support to Austria-Hungary: the “blank cheque”.',x:284,y:178},
 {id:'austria',name:'Austria-Hungary',tag:'Triple Alliance',text:'This empire ruled Bosnia, including Sarajevo. Its leaders blamed Serbia for the assassination and declared war on Serbia on 28 July.',x:340,y:270},
 {id:'italy',name:'Italy',tag:'Triple Alliance • neutral in 1914',text:'Italy said the alliance was defensive. It stayed neutral in 1914, then entered the war against Austria-Hungary in 1915.',x:249,y:348},
 {id:'serbia',name:'Serbia',tag:'Supported by Russia',text:'Serbia was an independent country. Russia supported it, but Serbia was not a member of the Triple Entente.',x:381,y:333},
 {id:'belgium',name:'Belgium',tag:'Neutral before the invasion',text:'Belgium was not in either grouping. Germany invaded it on 4 August to attack France. This helped bring Britain into the war.',x:220,y:203}
];
const allianceQs=[
 {q:'Which pair had a formal military alliance?',a:['France and Russia','Britain and Germany','Serbia and Belgium'],right:0,why:'France and Russia were formally allied. Russia also supported Serbia, a different relationship.'},
 {q:'Italy was in the Triple Alliance. What did it do in 1914?',a:['Immediately fought beside Germany','Stayed neutral','Joined Russia in July'],right:1,why:'Italy stayed neutral. An alliance did not remove a government’s ability to choose.'},
 {q:'Why could a local crisis spread?',a:['Every country had to fight by law','Support for partners could draw in rivals','All European countries shared one army'],right:1,why:'Backing partners could involve more countries. The agreements differed, and leaders still made decisions.'}
];
const dossiers=[
 {title:'A • Sarajevo',stamp:'Historian’s summary',text:'28 June 1914: Gavrilo Princip, a Bosnian Serb nationalist, killed Franz Ferdinand and Sophie in Sarajevo. Franz Ferdinand was heir to Austria-Hungary’s throne.',note:'Bosnia was ruled by Austria-Hungary. Sarajevo was not in independent Serbia. Princip wanted to end Habsburg rule over South Slavs.',source:'Secondary account: Annika Mombauer, The Open University, “The assassination of Franz Ferdinand” (2019). This card is our summary, not an eyewitness statement.'},
 {title:'B • A real demand',stamp:'Primary source • paraphrased',text:'23 July 1914: Austria-Hungary demanded that Serbia stop anti-Austrian activity and allow Austro-Hungarian officials to take part in investigating the plot in Serbia. A reply was required within 48 hours.',note:'An ultimatum is a final demand with a deadline. This document shows what Austria-Hungary demanded. Its accusations alone do not prove who ordered the murder.',source:'Austria-Hungary’s ultimatum to Serbia, 23 July 1914, especially points 5–6 and the deadline. Simplified paraphrase of a translated primary document; no invented quotation.'},
 {title:'C • A “what if?”',stamp:'Hypothetical • invented',text:'Imagine the visit was cancelled and the assassination never happened. Would Europe have stayed at peace?',note:'We can discuss possibilities, but we cannot know this alternative future. Rivalries and alliances would still have existed.',source:'A question created for this game. It is not a source from 1914 and is not evidence of what actually happened.'}
];
const sourceQs=[
 {q:'Where did the assassination happen?',a:['In Sarajevo, under Austria-Hungary’s rule','In Serbia’s capital','In Germany'],right:0,why:'Sarajevo was in Bosnia, ruled by Austria-Hungary. Do not confuse the assassin’s identity with the location.'},
 {q:'What can the ultimatum in Card B show us?',a:['That Serbia’s whole government ordered the murder','What Austria-Hungary demanded from Serbia','That every country wanted war'],right:1,why:'A demand is evidence of the sender’s position. It does not make every accusation true. Some Serbian officers helped the plot; that is not proof that the whole government ordered it.'},
 {q:'Which card describes an invented alternative?',a:['A • Sarajevo','B • A real demand','C • A “what if?”'],right:2,why:'Card C is hypothetical. Cards A and B concern real events, but A is a later summary and B paraphrases a document from the time.'}
];
const events=[
 {date:'5–6 July',title:'Germany backs Austria-Hungary',text:'The “blank cheque” gives Austria-Hungary confidence to act against Serbia.'},
 {date:'23–25 July',title:'Ultimatum and reply',text:'Austria-Hungary sends demands. Serbia accepts most, but not all. Austria-Hungary breaks diplomatic relations.'},
 {date:'28 July',title:'Austria-Hungary declares war on Serbia',text:'A regional war begins. The assassination did not bring immediate declarations from all the powers.'},
 {date:'30 July',title:'Russia orders general mobilisation',text:'Russia prepares its army, supporting Serbia and its own interests. Germany sees a threat. Mobilising is preparing for war, not the same as declaring it.'},
 {date:'1 & 3 August',title:'Germany declares war on Russia, then France',text:'Germany declares war on Russia on 1 August and France on 3 August. Its military plan aims to defeat France before turning east.'},
 {date:'4 August',title:'Germany invades Belgium; Britain enters',text:'The invasion of neutral Belgium helps bring Britain into war against Germany. British leaders also fear German domination and danger to France.'}
];
const exitQs=[
 {q:'Why did mobilisation make the crisis more dangerous?',a:['It made all negotiations legally impossible','Army preparations alarmed rivals and increased pressure to act','It was the same as signing a peace treaty'],right:1,why:'Mobilisation moved troops towards war. Rivals feared an attack. Leaders still made decisions; preparation was not itself a declaration.'},
 {q:'Which explanation best connects the causes?',a:['One assassination instantly forced all countries to fight','Long-term tensions made Europe unstable; the assassination sparked a crisis, then leaders’ decisions widened the war','The alliance system alone proves war was unavoidable'],right:1,why:'Use both background causes and the steps of escalation. Historians debate responsibility, but a list of alliances alone does not explain the decisions.'}
];
let stage=-1, index=0, points=0, attempts={}, completed=new Set(), visited=new Set(), selectedCountry='', dossierSeen=new Set(), dossierIndex=0, timelineOrder=[], exitIndex=0, phase='explore', reflection='';
const maxPoints=19;
function progress(){const names=['01 • Causes','02 • Alliances','03 • Sarajevo','04 • Crisis'];$('#progress').innerHTML=names.map((n,i)=>`<div class="step ${stage===i?'active':stage>i?'done':''}" ${stage===i?'aria-current="step"':''}>${stage>i?'✓ ':''}${n}</div>`).join('')}
function mount(html){$('#main').innerHTML=html;progress();$('#main').focus();window.scrollTo(0,0)}
function fb(){return '<div id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>'}
function feedback(ok,text){$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=(ok?'✓ Correct. ':'↻ Try again. ')+text}
function award(id,correct){if(completed.has(id))return;if(!(id in attempts)){attempts[id]=true;if(correct)points++}if(correct)completed.add(id)}
function nextButton(label,fn){const host=$('#next');host.innerHTML=`<button class="primary next" id="continue">${label} →</button>`;$('#continue').onclick=fn;$('#continue').focus()}
function start(){mount(`<section class="hero"><div><div class="eyebrow">Your mission • 10–15 minutes</div><h1>A shooting.<br>A crisis.<br>A world at war.</h1><p class="lede">Why did World War I start? Follow the clues from long-term rivalry to decisions made in 1914.</p><p>Work alone or with a partner. Read each card, choose an answer and use the feedback.</p><button class="primary" id="begin">Start the investigation →</button></div><div class="panel paper"><span class="stamp">Investigation file 1914</span><h2>Why Did World War I Start?</h2><p><b>1.</b> Sort background causes and the trigger.</p><p><b>2.</b> Explore who supported whom.</p><p><b>3.</b> Check the Sarajevo evidence.</p><p><b>4.</b> Rebuild the path to war.</p><div class="evidence"><b>Historical care:</b> You investigate real events. Any invented “what if?” is clearly labelled. Your choices do not rewrite history.</div></div></section>`);$('#begin').onclick=()=>{stage=0;index=0;renderCause()}}
function renderCause(){const c=causes[index];mount(`<p class="eyebrow">Round 1 • about 2 minutes • Card ${index+1} of 5</p><h2>Pressure building, or the spark?</h2><p class="lede"><b>Long-term cause:</b> tension building over years.<br><b>Immediate trigger:</b> the event that set off the crisis.</p><div class="layout"><section class="panel causeCard"><div class="big-icon" aria-hidden="true">${c.icon}</div><h3>${c.name}</h3><p>${c.text}</p></section><section><p><b>Sort this card.</b> Choose one:</p><div class="two"><button id="long">Long-term cause<br><span class="small">Pressure over years</span></button><button id="trigger">Immediate trigger<br><span class="small">Spark of the crisis</span></button></div>${fb()}<div id="next"></div></section></div>`);['long','trigger'].forEach((id,n)=>$('#'+id).onclick=()=>{const ok=n===c.answer;award('cause'+index,ok);feedback(ok,ok?c.why:(n===0?'This event happened on a specific day and sparked the crisis.':'This tension existed for years before June 1914.'));if(ok){$('#long').disabled=$('#trigger').disabled=true;nextButton(index===4?'Explore the alliances':'Next card',()=>{if(++index<5)renderCause();else{stage=1;phase='explore';renderAlliances()}})}})}
function mapSvg(selected=''){return `<div class="mapbox"><svg viewBox="0 0 560 430" role="img" aria-labelledby="mapTitle mapDesc"><title id="mapTitle">European relationships before the war, 1914</title><desc id="mapDesc">Schematic locator map, not political borders. Britain lies northwest of France; Germany is east of France; Russia is farther east; Austria-Hungary and Serbia lie southeast of Germany; Italy lies south. France and Russia are allied. Britain has Entente agreements. Germany, Austria-Hungary and Italy belong to the Triple Alliance. Russia supports Serbia. Belgium is neutral.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a424c" stroke-width="1"/></pattern></defs><rect width="560" height="430" fill="url(#grid)"/><text x="22" y="30" fill="#b8c8cf" font-size="13">EUROPE • 1914</text><text x="510" y="30" fill="#b8c8cf" font-size="13">N ↑</text><path d="M120 125L100 95 110 66 131 84 144 111 159 130 155 155 129 166 116 151Z M155 204L172 186 213 190 237 168 243 124 266 116 283 141 321 152 345 128 375 107 410 72 448 45 560 65V378L497 385 476 347 445 357 429 383 411 369 392 388 383 363 354 336 329 343 309 326 293 340 313 368 300 386 275 360 263 322 244 296 223 290 209 312 186 319 174 302 142 323 118 309 130 284 159 273 166 238Z" fill="#233c46" stroke="#4c6872" stroke-width="2"/>
<path class="link entente" d="M175 248Q300 40 455 125"/><path class="link entente" stroke-dasharray="9 7" d="M137 137L175 248 M137 137Q280 15 455 125"/><path class="link alliance" d="M284 178L340 270L249 348L284 178"/><path class="link support" d="M455 125L381 333"/>
${countries.map(c=>`<circle class="pin ${selected===c.id?'selected':''}" cx="${c.x}" cy="${c.y}" r="9"/><text class="map-label" x="${c.x+(c.id==='belgium'?-70:12)}" y="${c.y+(c.id==='belgium'?5:c.id==='austria'?25:-12)}">${c.name}</text>`).join('')}<circle cx="350" cy="322" r="5" fill="#ffb5a4"/><text class="map-label" x="281" y="316" font-size="12">Sarajevo</text><text x="22" y="411" fill="#c2cbd0" font-size="12">Schematic locations • no political borders • empires extend beyond view</text></svg></div>`}
function renderAlliances(){if(phase==='quiz'){renderQuiz(allianceQs,index,'alliance',()=>{stage=2;phase='explore';index=0;renderDossiers()},'Round 2 • Alliance check');return}const c=countries.find(c=>c.id===selectedCountry);mount(`<p class="eyebrow">Round 2 • about 3 minutes</p><h2>Who supported whom?</h2><p class="lede">Select all 8 country cards. Look for the difference between an alliance, an agreement and support.</p><div class="layout"><section>${mapSvg(selectedCountry)}<p class="line-key"><span style="color:var(--gold)">━ Triple Alliance</span><span style="color:var(--teal)">━ France–Russia alliance</span><br><span style="color:var(--teal)">┄ Britain’s Entente agreements</span><span>┄ Russia’s support for Serbia</span></p><p class="small">Lines show relationships, not routes for armies. The Triple Entente was a grouping, not one treaty forcing all three to fight.</p></section><section><div class="country-grid">${countries.map(c=>`<button data-country="${c.id}" aria-pressed="${c.id===selectedCountry}" class="${visited.has(c.id)?'visited':''}">${c.name}<span class="sr-only">${visited.has(c.id)?', read':''}</span></button>`).join('')}</div><div class="panel next" id="countryInfo" role="status" aria-live="polite">${c?`<span class="pill">${c.tag}</span><h3 style="margin-top:14px">${c.name}</h3><p>${c.text}</p>`:'<h3>Open a country card</h3><p>Start with Germany. Which countries are connected to it?</p>'}</div><p class="small">${visited.size} of 8 countries explored.</p><button class="primary wide" id="allianceCheck" ${visited.size<8?'disabled':''}>Check your understanding →</button></section></div>`);document.querySelectorAll('[data-country]').forEach(b=>b.onclick=()=>{selectedCountry=b.dataset.country;visited.add(selectedCountry);const scroll=window.scrollY;renderAlliances();const target=$(`[data-country="${selectedCountry}"]`);target.focus({preventScroll:true});window.scrollTo(0,scroll)});$('#allianceCheck').onclick=()=>{phase='quiz';index=0;renderAlliances()}}
function renderQuiz(qs,n,prefix,done,label){const q=qs[n];mount(`<p class="eyebrow">${label} • ${n+1} of ${qs.length}</p><h2>${q.q}</h2><div class="panel"><div class="choices">${q.a.map((a,i)=>`<button class="choice" data-answer="${i}"><span class="letter" aria-hidden="true">${String.fromCharCode(65+i)}</span>${a}</button>`).join('')}</div>${fb()}<div id="next"></div></div>`);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.answer===q.right;award(prefix+n,ok);b.classList.add(ok?'correct':'wrong');feedback(ok,ok?q.why:'Read the clues again. '+(prefix==='source'?'Check the source labels and what each card can tell us.':prefix==='exit'?'Think about pressure, decisions and the difference between preparing and declaring war.':'Countries had different commitments. They did not all join automatically.'));if(ok){document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);nextButton(n===qs.length-1?'Continue':'Next question',()=>{if(n+1<qs.length)renderQuiz(qs,n+1,prefix,done,label);else done()})}})}
function renderDossiers(){const d=dossiers[dossierIndex];dossierSeen.add(dossierIndex);mount(`<p class="eyebrow">Round 3 • about 3 minutes</p><h2>Investigate Sarajevo</h2><p class="lede">Open the three cards. Ask: is this an account of the past, a document from the time, or an invented possibility?</p><div class="source-tabs">${dossiers.map((d,i)=>`<button data-dossier="${i}" aria-pressed="${i===dossierIndex}">${d.title}${dossierSeen.has(i)?' ✓':''}</button>`).join('')}</div><article class="panel paper" id="dossier"><span class="stamp">${d.stamp}</span><h3>${d.title}</h3><p>${d.text}</p><p><b>Look closely:</b> ${d.note}</p><div class="evidence">${d.source}</div></article><p class="small">${dossierSeen.size} of 3 cards read. A later historian’s summary and a primary document are different kinds of source.</p><button class="primary next" id="sourceCheck" ${dossierSeen.size<3?'disabled':''}>Test the evidence →</button>`);document.querySelectorAll('[data-dossier]').forEach(b=>b.onclick=()=>{dossierIndex=+b.dataset.dossier;renderDossiers();$(`[data-dossier="${dossierIndex}"]`).focus({preventScroll:true})});$('#sourceCheck').onclick=()=>renderQuiz(sourceQs,0,'source',()=>{stage=3;phase='timeline';index=0;renderTimeline()},'Round 3 • Evidence check')}
function renderTimeline(){const remaining=[4,1,5,0,3,2].filter(i=>!timelineOrder.includes(i));mount(`<p class="eyebrow">Round 4 • about 4 minutes • Step ${index+1} of 6</p><h2>A crisis becomes a war</h2><p class="lede">The assassination was on 28 June. Choose the next event. Use the dates, then read <b>why it mattered</b>.</p><p class="notice"><b>Mobilisation:</b> calling up and preparing an army for war. <b>Declaration of war:</b> officially announcing war against another country.</p><div class="layout"><section class="panel"><h3>The path so far</h3><ol class="timeline"><li><strong>28 June • Sarajevo</strong>Franz Ferdinand and Sophie are assassinated.</li>${timelineOrder.map(i=>`<li><strong>${events[i].date}</strong>${events[i].title}</li>`).join('')}<li class="empty">Which event comes next?</li></ol></section><section><div class="choices">${remaining.map(i=>`<button class="event" data-event="${i}"><span class="event-date">${events[i].date} 1914</span>${events[i].title}</button>`).join('')}</div>${fb()}<div id="next"></div></section></div>`);document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{const chosen=+b.dataset.event;const ok=chosen===index;award('event'+index,ok);feedback(ok,ok?events[index].text:'That event comes later. Find the earliest remaining date.');if(ok){document.querySelectorAll('[data-event]').forEach(x=>x.disabled=true);nextButton(index===5?'Explain the connections':'Add to the timeline',()=>{timelineOrder.push(index);index++;if(index<6)renderTimeline();else renderQuiz(exitQs,0,'exit',finish,'Round 4 • Connect cause and effect')})}})}
function finish(){stage=4;mount(`<p class="eyebrow">Investigation complete</p><h2>One trigger. Several causes. Many decisions.</h2><div class="row"><span class="score">${points}<span style="font-size:1.6rem"> / ${maxPoints}</span></span><p>First-try answers<br><span class="small">You corrected and completed every check.</span></p></div><div class="recap"><div><b>Long-term pressures</b>Militarism, alliances, imperialism and nationalism increased tension.</div><div><b>Immediate trigger</b>The Sarajevo assassination sparked the July Crisis.</div><div><b>Escalation</b>Backing partners, demands, mobilisation and declarations widened the conflict.</div><div><b>Historical judgement</b>War was not automatic. Leaders made choices; historians debate responsibility.</div></div><section class="panel"><h3>Your 30-second explanation</h3><p>Tell your partner, or write 2–3 sentences. Use one background cause and one dated event.</p><label for="reflection">World War I began because…</label><textarea id="reflection" placeholder="One long-term cause was… This increased tension because… The assassination then… In July or August…">${esc(reflection)}</textarea><p class="small">This writing is not automatically marked or sent anywhere. Show your teacher before closing.</p><details><summary>Need a sentence starter?</summary><p>One long-term cause was ______. It made war more likely because ______. The assassination sparked a crisis. On ______, ______, which widened the conflict by ______.</p></details><div class="row"><button class="primary" id="print">Print / save this result</button><button id="restart">Play again</button></div></section><details><summary>Read the completed timeline</summary><ol class="timeline">${events.map(e=>`<li><strong>${e.date} 1914</strong>${e.title}. ${e.text}</li>`).join('')}</ol></details><p class="notice"><b>Australia’s connection:</b> Australia was a dominion of the British Empire. Britain’s declaration on 4 August (5 August in Australia) also placed Australia at war. Australia was not a separate member of the Triple Entente.</p>`);$('#reflection').oninput=e=>reflection=e.target.value;$('#print').onclick=()=>window.print();$('#restart').onclick=()=>showInfo('restart')}
function showInfo(type){const texts={
 help:`<h2 id="dialogTitle">Help &amp; teacher notes</h2><p><b>How to play:</b> use a mouse, touch, or Tab and Enter/Space. Read a card, choose, then use the feedback. Wrong answers can be retried. There is no timer or penalty for taking longer.</p><p><b>Classroom use:</b> allow 12–15 minutes, individually or in pairs. Ask partners to explain a choice before clicking. Spend the final minute hearing their cause-and-effect explanations.</p><p><b>Suggested pacing:</b> causes 2 min; alliances 3 min; Sarajevo 3 min; crisis and exit explanation 4–6 min.</p><p><b>Scoring:</b> one point for each first-try correct answer, out of 19. Every check must be corrected to finish. Country and source-card exploration is not scored.</p><p><b>Learning focus:</b> distinguish long-term causes from the trigger; explain connections between events; recognise primary evidence, secondary summaries and hypothetical questions.</p><p><b>Access:</b> use Larger text or browser zoom. No dragging, hover-only clues, sound or time limits. The map has a text description; all country information is available through labelled buttons.</p><p><b>Use without QLearn:</b> download the HTML file and double-click it in a browser. Give students a copy through your normal file-sharing method. No accounts, installation or internet are needed after download.</p><p><b>Teacher prompts:</b> “Why is Italy a useful exception?” “How is mobilisation different from declaring war?” “Why can’t an accusation prove who ordered a crime?”</p>`,
 sources:`<h2 id="dialogTitle">Sources &amp; map notes</h2><p>All activity text is written for this game. There are no invented historical quotations. Card B is explicitly a paraphrase, not a reproduction of the document.</p><ul><li><a href="https://nzhistory.govt.nz/war/first-world-war-overview/origins" target="_blank" rel="noopener">NZHistory, Manatū Taonga: Origins of the war</a> — background rivalries, alliances and military planning.</li><li><a href="https://www.open.edu/openlearn/history-the-arts/history/world-history/the-assassination-franz-ferdinand" target="_blank" rel="noopener">Annika Mombauer, The Open University: The assassination of Franz Ferdinand</a> (2019) — Sarajevo, Princip and the distinction between the plot and government responsibility.</li><li><a href="https://www.open.edu/openlearn/history-the-arts/history/world-history/the-july-crisis-chronology" target="_blank" rel="noopener">Annika Mombauer: The July Crisis: A chronology</a> (2024) — July decisions and the different alliance commitments. Its Belgium invasion date is cross-checked against the source below.</li><li><a href="https://www.dhm.de/lemo/kapitel/erster-weltkrieg/kriegsverlauf/juli-krise-1914" target="_blank" rel="noopener">Deutsches Historisches Museum: Die Juli-Krise 1914</a> — mobilisation, declarations and the invasion of Belgium on 4 August.</li><li><a href="https://www.gwpda.org/1914/austro-hungarian-ultimatum.html" target="_blank" rel="noopener">Great War Primary Documents Archive: Austro-Hungarian Ultimatum, 23 July 1914</a> — translated primary text underlying Card B.</li><li><a href="https://www.awm.gov.au/articles/atwar/first-world-war" target="_blank" rel="noopener">Australian War Memorial: First World War 1914–18</a> — Australia and the British declaration.</li></ul><p><b>Map:</b> original schematic locator illustration, not a primary source or a map of exact 1914 borders. Locations are simplified; lines show relationships, not troop movements. Only selected European countries are shown. Britain represents the United Kingdom; empires extended beyond the frame. Italy’s pre-war membership must not be mistaken for its wartime side.</p><p><b>Scope:</b> an introductory explanation, not a complete account of every mobilisation or declaration. The six timeline cards select key steps. The Ottoman Empire and Bulgaria entered later and are outside this activity’s June–August focus.</p><p>Links need internet; the game itself does not. Historical content checked 21 October 2026.</p>`,
 restart:`<h2 id="dialogTitle">Start a new investigation?</h2><p>This clears your score and written explanation.</p><button id="confirmRestart" class="primary">Yes, start again</button>`};$('#infoBody').innerHTML=texts[type];$('#info').showModal();if(type==='restart')$('#confirmRestart').onclick=()=>{$('#info').close();stage=-1;index=0;points=0;attempts={};completed.clear();visited.clear();dossierSeen.clear();selectedCountry='';dossierIndex=0;timelineOrder=[];reflection='';phase='explore';start()}}
$('#help').onclick=()=>showInfo('help');$('#sources').onclick=()=>showInfo('sources');$('#closeInfo').onclick=()=>$('#info').close();$('#size').onclick=()=>{const on=document.body.classList.toggle('large');$('#size').setAttribute('aria-pressed',String(on));$('#size').textContent=on?'Standard text':'Larger text'};start();
</script>
</body>
</html>
